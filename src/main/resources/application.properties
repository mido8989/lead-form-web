spring.application.name=lead-form-web
spring.datasource.url=jdbc:h2:file:./data/leads
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.h2.console.enabled=true
salesforce.domain=${SF_DOMAIN:}
salesforce.client-id=${SF_CLIENT_ID:}
salesforce.client-secret=${SF_CLIENT_SECRET:}
salesforce.api-version=v67.0