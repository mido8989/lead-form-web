<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us</title>
  <style>
    :root { --ink: #16202b; --muted: #5b6875; --line: #cfd7df; --accent: #0b5cab; --bg: #f3f6f9; --ok: #17683a; --bad: #a61b1b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 34rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
    p.lead { margin: 0 0 1.5rem; color: var(--muted); }
    form { background: #fff; border: 1px solid var(--line); border-radius: .75rem; padding: 1.5rem; display: grid; gap: 1rem; }
    .row { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
    @media (max-width: 30rem) { .row { grid-template-columns: 1fr; } }
    label { display: grid; gap: .35rem; font-size: .9rem; font-weight: 600; }
    input, textarea { font: inherit; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: .5rem; width: 100%; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    textarea { min-height: 6rem; resize: vertical; }
    button { font: inherit; font-weight: 600; padding: .7rem 1rem; border: 0; border-radius: .5rem; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .hp { position: absolute; left: -9999px; }
    #status { margin: 0; min-height: 1.25rem; font-size: .95rem; }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    section.panel { margin-top: 2.5rem; }
    section.panel h2 { margin: 0 0 .25rem; font-size: 1.25rem; }
    section.panel p.note { margin: 0 0 1rem; color: var(--muted); font-size: .9rem; }
    .table-wrap { background: #fff; border: 1px solid var(--line); border-radius: .75rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .6rem .9rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    td.empty { color: var(--muted); text-align: center; padding: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>Contact us</h1>
    <p class="lead">Leave your details and we will get back to you.</p>

    <form id="lead-form" novalidate>
      <div class="row">
        <label>First name
          <input name="firstName" autocomplete="given-name" maxlength="40">
        </label>
        <label>Last name *
          <input name="lastName" autocomplete="family-name" maxlength="80" required>
        </label>
      </div>
      <label>Company *
        <input name="company" autocomplete="organization" maxlength="255" required>
      </label>
      <div class="row">
        <label>Email *
          <input name="email" type="email" autocomplete="email" maxlength="80" required>
        </label>
        <label>Phone
          <input name="phone" type="tel" autocomplete="tel" maxlength="40">
        </label>
      </div>
      <label>Message
        <textarea name="message" maxlength="2000"></textarea>
      </label>

      <!-- Honeypot: hidden from people, filled in by simple bots. -->
      <label class="hp" aria-hidden="true">Website
        <input name="website" tabindex="-1" autocomplete="off">
      </label>

      <button type="submit">Submit</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <!-- Read-only: this section only displays data. It has no inputs and nothing here can be edited. -->
    <section class="panel" aria-labelledby="accounts-title">
      <h2 id="accounts-title">Latest accounts from Salesforce</h2>
      <p class="note">Sent to this site by Salesforce when an account is created. Refreshes automatically.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Account</th><th>Industry</th><th>Created</th></tr>
          </thead>
          <tbody id="accounts-body">
            <tr><td class="empty" colspan="3">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("lead-form");
    const statusEl = document.getElementById("status");
    const button = form.querySelector("button");

    function show(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!form.checkValidity()) {
        show("Please fill in last name, company and a valid email.", "bad");
        return;
      }

      const data = Object.fromEntries(new FormData(form).entries());
      button.disabled = true;
      show("Sending...");

      try {
        const response = await fetch("/api/leads", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const result = await response.json().catch(() => ({}));

        if (response.ok) {
          form.reset();
          show("Thank you. Your request has been received.", "ok");
        } else {
          show(result.error || "Something went wrong. Please try again.", "bad");
        }
      } catch (error) {
        show("Could not reach the server. Please try again.", "bad");
      } finally {
        button.disabled = false;
      }
    });

    // ----- Read-only accounts panel -----
    const accountsBody = document.getElementById("accounts-body");

    function messageRow(text) {
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.className = "empty";
      cell.colSpan = 3;
      cell.textContent = text;
      row.appendChild(cell);
      return row;
    }

    function accountRow(account) {
      const row = document.createElement("tr");
      const created = account.createdAt ? new Date(account.createdAt).toLocaleString() : "";
      for (const value of [account.name, account.industry || "", created]) {
        const cell = document.createElement("td");
        // textContent shows the value as plain text, so nothing in the data can run as code.
        cell.textContent = value;
        row.appendChild(cell);
      }
      return row;
    }

    async function loadAccounts() {
      try {
        const response = await fetch("/api/accounts");
        if (!response.ok) throw new Error("HTTP " + response.status);
        const accounts = await response.json();
        const rows = accounts.length
          ? accounts.map(accountRow)
          : [messageRow("No accounts received yet.")];
        accountsBody.replaceChildren(...rows);
      } catch (error) {
        accountsBody.replaceChildren(messageRow("Could not load accounts."));
      }
    }

    loadAccounts();
    setInterval(loadAccounts, 30000);
  </script>
</body>
</html>
